# Render blueprint for the Neem API (decision D44).
#
# Render is chosen for one reason above the others: its deploy model is the one
# this project already operates on Netlify — connect the repository, push to
# deploy. The alternatives were capable too; the deciding factor was not
# capability but how much new machinery a two-person team has to learn to run a
# pilot.
#
# What this describes is deliberately one small always-on instance, because
# that is what the code requires rather than a cost compromise:
#
#   * Background jobs run INSIDE the API process (`src/jobs/scheduler.ts`),
#     including a five-second sweep enforcing the 90-second doctor response
#     window. So the service must never scale to zero — a sleeping instance
#     stops expiring offers — and must never run two copies, which would offer
#     every consultation twice.
#   * Socket.IO has no Redis adapter, so its state is in memory. A second
#     instance would not see the first's connections.
#   * Prescription PDFs and doctor credentials are written to local disk. They
#     are permanent records, so the disk below is not a cache — losing it loses
#     prescriptions.
#
# Attaching a disk makes Render deploy by stopping and restarting rather than
# overlapping, so each deploy is a short gap. That is a real cost and it is
# accepted: the alternative is running two instances, which the jobs forbid.
#
# Deploy outside consultation hours.

services:
  - type: web
    name: neem-api
    runtime: node
    # Always-on. The `free` plan sleeps, which would stop the job sweeps.
    #
    # `0.5c-512mb` rather than `starter`: Render's Blueprint spec now names
    # plans by their resources, and the old tier names are no longer accepted —
    # which is what "a Blueprint file was found, but there was an issue" meant.
    # Same machine either way, 0.5 CPU and 512 MB, which is what Starter was.
    plan: 0.5c-512mb
    region: frankfurt # Must match the Supabase project's region — see the note below.
    branch: main

    # `npm ci` for a reproducible install, then the Prisma client, then the
    # bundle. `db:generate` is explicit because this repository has no
    # postinstall hook: without it the build succeeds and the server dies on
    # its first query.
    #
    # `--include=dev` is load bearing, not belt and braces. NODE_ENV is
    # `production` below, and npm reads that as `--omit=dev`: a plain `npm ci`
    # here installs no devDependencies at all. The three tools this build runs
    # on — `typescript` (the contracts check), `prisma` (the client, and the
    # `migrate deploy` in preDeployCommand) and `esbuild` (the bundle) — are
    # all devDependencies, so the build fails on its first step with a missing
    # binary rather than anything that names the cause.
    buildCommand: >-
      npm ci --include=dev &&
      npm run build --workspace @neem/contracts &&
      npm run db:generate --workspace @neem/api &&
      npm run build --workspace @neem/api

    # Migrations run before the new instance serves traffic, and a failure here
    # stops the deploy rather than starting a server against a schema it does
    # not match. Over Supabase this uses DIRECT_DATABASE_URL, because a
    # transaction pooler cannot carry the statements Prisma Migrate needs.
    preDeployCommand: npm run db:deploy --workspace @neem/api

    startCommand: node apps/api/dist/server.js

    # Cheap and constant: it returns a fixed body and touches nothing.
    # `/health/ready` checks the database and is for an operator, not a probe.
    healthCheckPath: /api/v1/health

    disk:
      name: neem-uploads
      # STORAGE_LOCAL_PATH points here. An ABSOLUTE path matters: a relative one
      # is resolved against the repository root, which puts prescriptions on the
      # container's ephemeral filesystem and destroys them on the next deploy.
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: NODE_ENV
        value: production

      # Render injects PORT; the API reads API_PORT and falls back to PORT.
      # Nothing to set.

      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_LOCAL_PATH
        value: /var/data/uploads

      # --- Set in the Render dashboard, never in this file -------------------
      #
      # `sync: false` means "prompt me, and keep it out of the repository".
      # These are the values that would be a disclosure if committed.

      # BOTH of these use the POOLER host. Only the port and the parameters
      # differ between them:
      #
      #   postgresql://postgres.PROJECT:PASSWORD
      #     @aws-0-REGION.pooler.supabase.com:PORT/postgres?...
      #
      # Never `db.PROJECT.supabase.co`, which is the host Supabase labels
      # "Direct connection". It resolves to IPv6 only without the IPv4 add-on
      # and Render's outbound traffic is IPv4, so it works from a laptop and is
      # unreachable from here. Note also that the pooler needs the project
      # reference appended to the username — `postgres.PROJECT`, not `postgres`.
      #
      # This warning used to sit on DIRECT_DATABASE_URL alone, while the line
      # above DATABASE_URL said only "port 6543". Reading the two together, the
      # obvious move is to take the direct connection string and change its
      # port — which produces `db.PROJECT.supabase.co:6543`, a host that serves
      # 5432 and cannot be reached from Render anyway. That is exactly what
      # happened on the first deploy: the API booted, answered /health, and
      # returned 503 from /health/ready with "Can't reach database server".

      # TRANSACTION pooler — port 6543, ?sslmode=require&pgbouncer=true
      #
      # `pgbouncer=true` is not optional. Transaction pooling cannot carry
      # prepared statements, which Prisma uses by default, and without it the
      # failures arrive later and read as database faults rather than as
      # configuration.
      - key: DATABASE_URL
        sync: false

      # SESSION pooler — port 5432, ?sslmode=require
      #
      # Migrations run over this one, because a transaction pooler cannot carry
      # the statements Prisma Migrate needs. Session mode does, and is on the
      # same IPv4 pooler host.
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: CSRF_SECRET
        sync: false
      - key: ENCRYPTION_KEY # Losing this makes every encrypted field unreadable. Back it up.
        sync: false

      # BACKUP_ENCRYPTION_KEY is deliberately NOT here. `scripts/backup.mjs`
      # reads it directly and the API never runs that script, so setting it on
      # this service would imply a backup arrangement that does not exist.
      #
      # It does not exist yet, and that is an open item rather than an
      # oversight: Supabase backs up the database on its own schedule, but the
      # DISK BELOW IS NOT COVERED BY THAT. It holds signed prescription PDFs and
      # doctor credential documents — permanent records — and nothing currently
      # copies them anywhere. A Render cron service running `npm run backup`
      # would produce a file on its own ephemeral disk and discard it, so the
      # missing piece is somewhere durable to put it, not the schedule.

      # --- Origins ------------------------------------------------------------
      # Exact, with scheme and no trailing slash. CORS is an allow-list and the
      # session cookie travels on it, so a mismatch fails closed.

      - key: WEB_ORIGIN
        value: https://app.neemtelehealth.com
      - key: MARKETING_ORIGIN
        value: https://neemtelehealth.com
      - key: API_PUBLIC_URL
        value: https://api.neemtelehealth.com

      # --- Providers ----------------------------------------------------------

      - key: VIDEO_PROVIDER
        value: whereby
      - key: WHEREBY_API_KEY
        sync: false

      # --- Payment ------------------------------------------------------------
      #
      # Paystack is the only implemented payment adapter. Both keys are required
      # by the config loader when PAYMENT_PROVIDER=paystack, so the API will not
      # boot without them — note that PAYSTACK_PUBLIC_KEY is required and then
      # read by nothing, because Neem's payment flow is server-initiated and has
      # no frontend checkout widget to hand it to.
      #
      # Use the LIVE pair here. Test keys belong on a developer's machine; the
      # two differ only by an `sk_test_` / `sk_live_` prefix, and nothing in the
      # code distinguishes them.
      - key: PAYMENT_PROVIDER
        value: paystack
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      #
      # The domain half of the synthetic per-transaction address Paystack
      # requires. Neem collects a phone number at the counter and never an
      # email, so the adapter derives one from its own payment reference — it
      # carries no patient data, and being per-transaction means a receipt
      # cannot reach the wrong person.
      #
      # It needs NO DNS RECORD, and deliberately has none: nothing sends to it
      # or reads from it. Verified against Paystack in test mode — a transaction
      # addressed to this domain while it was NXDOMAIN was accepted, so Paystack
      # validates the format and not the deliverability. Do not create an A
      # record for it; a domain with an A record and no MX becomes its own
      # implicit mail destination, which is worse than nothing.
      - key: PAYSTACK_RECEIPT_DOMAIN
        value: receipts.neemtelehealth.com

      # --- Email --------------------------------------------------------------
      #
      # SMTP rather than a vendor API, so the relay is configuration rather than
      # another adapter. SMTP_PORT matters more than it looks: it defaults to
      # 1025, which is MailHog's, and the provider switches to implicit TLS only
      # when the port is exactly 465. Leaving it unset would point production at
      # a local development catcher.
      #
      # Load bearing for the pilot. With SMS switched off (D46) the doctor's
      # consultation offer arrives by email alone, against a 90-second response
      # window — so this is the channel the queue depends on.
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        value: mail.privateemail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: hello@neemtelehealth.com
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: "Neem <hello@neemtelehealth.com>"

      # Call Me stays off until Arkesel confirm a live two-leg bridge (D39, D42).
      # `none` is not `mock`: a mock pretends, `none` says the capability is
      # absent, and the patient is never offered a mode the server would refuse.
      - key: VOICE_PROVIDER
        value: none

      # SMS is off for the pilot (D46), and `none` is how a deployment says so.
      #
      # `none` is not `mock`, the same distinction VOICE_PROVIDER draws above: a
      # mock reports messages that were never sent, which production refuses;
      # `none` says the channel is absent, and notifications that would have
      # gone by SMS go by email instead.
      #
      # ARKESEL_API_KEY and ARKESEL_SENDER_ID are deliberately NOT listed. They
      # are required only when SMS_PROVIDER=arkesel, so with `none` there is
      # nothing to obtain and nothing to enter — no key fetched for a dormant
      # feature, and no sender ID invented to satisfy a check, which would be a
      # sender ID nobody had registered with the networks.
      #
      # To turn SMS on later: register the sender ID, add ARKESEL_API_KEY and
      # ARKESEL_SENDER_ID here, change this value to `arkesel`, then switch the
      # `notifications.smsEnabled` setting on in the admin console. Both layers
      # have to agree, which is why neither alone can start sending by accident.
      - key: SMS_PROVIDER
        value: none

      # --- Demo data must never exist here ------------------------------------
      # The config loader refuses this in production anyway (spec §76); stating
      # it means nobody has to discover that by being refused.
      - key: SEED_DEMO_DATA
        value: "false"

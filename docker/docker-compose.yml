name: neem

services:
  mysql:
    image: mysql:8.4
    container_name: neem-mysql
    restart: unless-stopped
    command:
      # utf8mb4 throughout so Ghanaian language content and clinical free text
      # round-trip correctly, and a fixed timezone so date arithmetic in the
      # 40-hour rule and shift scheduling is not host-dependent.
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --max_connections=200
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-neem_root_dev}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-neem}
      MYSQL_USER: ${MYSQL_USER:-neem}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-neem_dev}
    ports:
      - '${MYSQL_PORT:-3307}:3306'
    volumes:
      - neem-mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${MYSQL_ROOT_PASSWORD:-neem_root_dev}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Captures every outbound development email so the notification adapters can
  # be exercised without a real provider account. UI at http://localhost:8025
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: neem-mailhog
    restart: unless-stopped
    ports:
      - '${MAILHOG_SMTP_PORT:-1025}:1025'
      - '${MAILHOG_UI_PORT:-8025}:8025'
    logging:
      driver: none

  # Optional DB browser at http://localhost:8081 — start with:
  #   docker compose -f docker/docker-compose.yml --profile tools up -d
  adminer:
    image: adminer:4
    container_name: neem-adminer
    restart: unless-stopped
    profiles: ['tools']
    ports:
      # 8081, not 8080: the web dev server owns 8080 (WEB_PORT), so the two
      # collided for anyone who started the tools profile while developing —
      # and the README told them to do exactly that.
      - '${ADMINER_PORT:-8081}:8080'
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  neem-mysql-data:
    name: neem-mysql-data

name: neem

services:
  postgres:
    # 17 is what Supabase runs, and matching it locally is the point of pinning
    # a major version at all: a difference between the machine a migration is
    # written on and the machine it is applied to is the kind that surfaces
    # during a deploy rather than during a test.
    image: postgres:17
    container_name: neem-postgres
    restart: unless-stopped
    command:
      # UTC everywhere, so date arithmetic in the 40-hour rule and in shift
      # scheduling is not host-dependent.
      - -c
      - timezone=UTC
      - -c
      - max_connections=200
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neem}
      POSTGRES_USER: ${POSTGRES_USER:-neem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neem_dev}
      # Ghanaian language content and clinical free text round-trip correctly
      # on UTF-8; the collation is deterministic so ordering does not drift
      # between machines.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - neem-postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neem} -d ${POSTGRES_DB:-neem}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # Captures every outbound development email so the notification adapters can
  # be exercised without a real provider account. UI at http://localhost:8025
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: neem-mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
    logging:
      driver: none

  # Optional DB browser at http://localhost:8081 — start with:
  #   docker compose -f docker/docker-compose.yml --profile tools up -d
  adminer:
    image: adminer:4
    container_name: neem-adminer
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      # 8081, not 8080: the web dev server owns 8080 (WEB_PORT), so the two
      # collided for anyone who started the tools profile while developing —
      # and the README told them to do exactly that.
      - "${ADMINER_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DEFAULT_DRIVER: pgsql
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  neem-postgres-data:
    name: neem-postgres-data
